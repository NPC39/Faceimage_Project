services:
  postgres:
    image: postgres:16-alpine
    container_name: photo_marketplace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-photomarket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-photomarket}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Docker/Dockerfile.backend
    container_name: photo_marketplace_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-photomarket}
      - CORS_ORIGINS=["http://localhost:3000"]
      - FACE_MODEL_NAME=buffalo_l
      - FACE_MODEL_PROVIDERS=CPUExecutionProvider
      - MAX_FACE_IMAGE_MB=20
      - FACE_SERVICE_API_KEY=${FACE_SERVICE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ~/.insightface:/root/.insightface
      - ./Backend/app:/app/app


    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Docker/Dockerfile.frontend
    container_name: photo_marketplace_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-photomarket}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-development_secret_change_in_production_32bytes_min}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_ROOT=/app/storage
      - MAX_PHOTO_UPLOAD_MB=${MAX_PHOTO_UPLOAD_MB:-20}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - FACE_SERVICE_URL=http://backend:8000
      - FACE_SERVICE_API_KEY=${FACE_SERVICE_API_KEY:-}
      - FACE_SERVICE_TIMEOUT_MS=60000
      - FACE_PROCESSING_CONCURRENCY=2
      - FACE_MATCH_THRESHOLD=0.40
      - FACE_MATCH_AMBIGUITY_GUARD_ENABLED=true
      - FACE_MATCH_AMBIGUITY_MARGIN=0.002

    ports:
      - "3000:3000"
    volumes:
      - photo_storage:/app/storage
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: photo_marketplace_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  photo_storage:
  insightface_models:

